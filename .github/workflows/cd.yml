name: ci

on:
  push:
    branches: [main]
job:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

  steps:
    - name: Check out code
    - uses: actions/checkout@v6

    - name: Go activation
    - uses: actions/set-up@v6
    - with:
        go-version: "1.26.0"

    - name: Build app
    - run: ./scripts/buildprod.sh
