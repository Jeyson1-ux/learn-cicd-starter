name: cd

on:
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Go activation
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build app
        run: ./scripts/buildprod.sh

      - name: Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{secrets.GCP_CREDENTIALS }}

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-507821/notely-ar-repo/notely:latest .
